<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrandonsBox| Log In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <a class="logo" href="Homepage.html">Brandons<span>Box</span></a>
        <button id="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
        <nav id="main-nav">
            <a href="Homepage.html">Home</a>
            <a href="Products.html">Products</a>
            <a href="AboutUs.html">About Us</a>
            <a href="ContactUs.html">Contact Us</a>
            <a href="signup.html">Sign Up</a>
            <a href="login.html">Login</a>
            <a href="Products.html">🛒 Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main class="form-box">
        <h2>Welcome back</h2>
        <p>Please log in</p>

        <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="yourgmail@gmail.com">
            <span class="error" id="email-error"></span>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password">
            <span class="error" id="password-error"></span>

            <button type="submit">Log In</button>
            <div id="form-message"></div>
        </form>

        <p style="text-align:center;"><a href="signup.html">New account? Sign up</a></p>
    </main>

    <script src="script.js" defer></script>
</body>

</html>
